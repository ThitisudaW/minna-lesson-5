<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minna no Nihongo Lesson 5 - Japanese Flashcards</title>
    
    <!-- Modern Google Fonts: Prompt (Thai) & Noto Sans JP / Zen Maru Gothic (Japanese) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Prompt:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff6b8b;
            --primary-light: #ff8ea7;
            --primary-soft: #fff0f3;
            --card-bg: #ffffff;
            --card-back-bg: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            --text-main: #2d3436;
            --text-muted: #636e72;
            --shadow-soft: 0 10px 30px rgba(255, 107, 139, 0.12);
            --shadow-hover: 0 15px 35px rgba(255, 107, 139, 0.22);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', 'Noto Sans JP', sans-serif;
        }

        body {
            background: #fff8f9;
            background-image: 
                radial-gradient(#ffccd5 1.5px, transparent 1.5px), 
                radial-gradient(#ffccd5 1.5px, #fff8f9 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px;
            position: relative;
        }

        /* Ambient Sakura Effect */
        .sakura-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .petal {
            position: absolute;
            background: #ffb3c6;
            border-radius: 15px 0 15px 0;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.1; }
        }

        .app-container {
            max-width: 1040px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 35px 25px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04), 0 10px 25px rgba(255, 107, 139, 0.08);
            position: relative;
            z-index: 20;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-badge {
            display: inline-block;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border: 1px solid #ffccd5;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        h1 span {
            color: var(--primary);
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* Category Nav */
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .nav-tab {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px 18px;
            border-radius: 50px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-tab:hover {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: #ffccd5;
        }

        .nav-tab.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.3);
            transform: translateY(-2deg);
        }

        /* Stepper Toolbar */
        .stepper-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: 1px solid #f1f3f5;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .step-btn {
            background: #ffffff;
            border: 1.5px solid #edf2f7;
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-soft);
        }

        .step-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cat-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Quick Tools */
        .quick-tools {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tool-chip {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-soft);
        }

        /* Modern 3D Flip Card Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            min-height: 320px;
        }

        /* Card Entry Animation */
        @keyframes cardPopIn {
            from { opacity: 0; transform: scale(0.85) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card {
            height: 190px;
            perspective: 1000px;
            cursor: pointer;
            animation: cardPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: all 0.3s ease;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
        }

        .card:hover .card-inner {
            box-shadow: var(--shadow-hover);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* Card Front Styling (Japanese Only) */
        .card-front {
            background: var(--card-bg);
            border: 1.5px solid #f1f3f5;
        }

        .jp-hiragana {
            font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .jp-kanji {
            font-size: 1rem;
            color: var(--text-muted);
            background: #f8f9fa;
            padding: 3px 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .audio-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #f8f9fa;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            background: var(--primary);
            color: #ffffff;
            transform: scale(1.15);
        }

        /* Card Back Styling (Visual Icon + Meaning) */
        .card-back {
            background: var(--card-back-bg);
            color: #ffffff;
            transform: rotateY(180deg);
            gap: 8px;
        }

        .visual-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
        }

        .th-meaning {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.2px;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .app-container { padding: 20px 15px; }
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .card { height: 165px; }
            .jp-hiragana { font-size: 1.35rem; }
            .th-meaning { font-size: 1.05rem; }
            .visual-icon { font-size: 2rem; }
            .stepper-bar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="sakura-layer" id="sakuraLayer"></div>

    <div class="app-container">
        <header>
            <div class="brand-badge">MINNA NO NIHONGO</div>
            <h1><span>みんなの日本語</span> บทที่ 5</h1>
            <p class="subtitle">บัตรคำศัพท์ภาษาญี่ปุ่นพร้อมเสียงอ่านและภาพประกอบ</p>
        </header>

        <!-- Category Tabs Navigation -->
        <div class="category-nav" id="categoryNav"></div>

        <!-- Stepper Navigation -->
        <div class="stepper-bar">
            <button class="step-btn" id="prevBtn" onclick="navigateCategory(-1)">
                <span>←</span> หน้าก่อนหน้า
            </button>
            <div class="cat-title" id="catTitle">หมวดคำศัพท์</div>
            <button class="step-btn" id="nextBtn" onclick="navigateCategory(1)">
                หน้าถัดไป <span>→</span>
            </button>
        </div>

        <!-- Quick Action Tools -->
        <div class="quick-tools">
            <button class="tool-chip" onclick="shuffleCards()">🔀 สลับการ์ดสุ่มคำ</button>
            <button class="tool-chip" onclick="resetFlips()">🔄 หงายการ์ดทั้งหมด</button>
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" id="cardsGrid"></div>

        <footer>
            💡 แตะที่การ์ดเพื่อดูคำแปลและรูปภาพประกอบ | กดรูป 🔊 บนการ์ดเพื่อฟังเสียงอ่าน
        </footer>
    </div>

    <script>
        // Vocabulary dataset
        const vocabularyData = [
            {
                id: 'verbs',
                navName: '1. กริยา',
                title: '🌸 หมวดที่ 1: คำกริยา (Verbs)',
                items: [
                    { hiragana: "いきます", kanji: "行きます", thai: "ไป", icon: "🚶‍♂️" },
                    { hiragana: "きます", kanji: "来ます", thai: "มา", icon: "🏃‍♀️" },
                    { hiragana: "かえります", kanji: "帰ります", thai: "กลับ", icon: "🏠" }
                ]
            },
            {
                id: 'places',
                navName: '2. สถานที่',
                title: '🏫 หมวดที่ 2: สถานที่ (Places)',
                items: [
                    { hiragana: "がっこう", kanji: "学校", thai: "โรงเรียน", icon: "🏫" },
                    { hiragana: "スーパー", kanji: "-", thai: "ซูเปอร์มาร์เก็ต", icon: "🛒" },
                    { hiragana: "えき", kanji: "駅", thai: "สถานีรถไฟ", icon: "🚉" }
                ]
            },
            {
                id: 'transport',
                navName: '3. ยานพาหนะ',
                title: '🚆 หมวดที่ 3: ยานพาหนะ (Vehicles)',
                items: [
                    { hiragana: "ひこうき", kanji: "飛行機", thai: "เครื่องบิน", icon: "✈️" },
                    { hiragana: "ふね", kanji: "船", thai: "เรือ", icon: "🚢" },
                    { hiragana: "でんしゃ", kanji: "電車", thai: "รถไฟ", icon: "🚃" },
                    { hiragana: "ちかてつ", kanji: "地下鉄", thai: "รถไฟใต้ดิน", icon: "🚇" },
                    { hiragana: "しんかんせん", kanji: "新幹線", thai: "รถไฟชินคันเซ็น", icon: "🚅" },
                    { hiragana: "バス", kanji: "-", thai: "รถบัส", icon: "🚌" },
                    { hiragana: "タクシー", kanji: "-", thai: "รถแท็กซี่", icon: "🚕" },
                    { hiragana: "じてんしゃ", kanji: "自転車", thai: "จักรยาน", icon: "🚲" },
                    { hiragana: "あるいて", kanji: "歩いて", thai: "เดิน", icon: "👟" }
                ]
            },
            {
                id: 'people',
                navName: '4. บุคคล',
                title: '👥 หมวดที่ 4: บุคคล (People)',
                items: [
                    { hiragana: "ひと", kanji: "人", thai: "คน, ผู้คน", icon: "👤" },
                    { hiragana: "ともだち", kanji: "友達", thai: "เพื่อน", icon: "🤝" },
                    { hiragana: "かれ", kanji: "彼", thai: "เขา (ผู้ชาย), แฟนผู้ชาย", icon: "👨" },
                    { hiragana: "かのじょ", kanji: "彼女", thai: "เธอ, แฟนผู้หญิง", icon: "👩" },
                    { hiragana: "かぞく", kanji: "家族", thai: "ครอบครัว", icon: "👨‍👩‍👧‍👦" },
                    { hiragana: "ひとりで", kanji: "一人で", thai: "คนเดียว", icon: "🧍" }
                ]
            },
            {
                id: 'time',
                navName: '5. เวลา/ช่วงเวลา',
                title: '⏰ หมวดที่ 5: เวลา/สัปดาห์/เดือน/ปี (Time)',
                items: [
                    { hiragana: "せんしゅう", kanji: "先週", thai: "สัปดาห์ที่แล้ว", icon: "⬅️📅" },
                    { hiragana: "こんしゅう", kanji: "今週", thai: "สัปดาห์นี้", icon: "📅" },
                    { hiragana: "らいしゅう", kanji: "来週", thai: "สัปดาห์หน้า", icon: "📅➡️" },
                    { hiragana: "せんげつ", kanji: "先月", thai: "เดือนที่แล้ว", icon: "🌙⬅️" },
                    { hiragana: "こんげつ", kanji: "今月", thai: "เดือนนี้", icon: "🌙" },
                    { hiragana: "らいげつ", kanji: "来月", thai: "เดือนหน้า", icon: "🌙➡️" },
                    { hiragana: "きょねん", kanji: "去年", thai: "ปีที่แล้ว", icon: "⏳" },
                    { hiragana: "ことし", kanji: "今年", thai: "ปีนี้", icon: "✨" },
                    { hiragana: "らいねん", kanji: "来年", thai: "ปีหน้า", icon: "🚀" },
                    { hiragana: "ーねん", kanji: "―年", thai: "ปี...", icon: "🔢" },
                    { hiragana: "なんねん", kanji: "何年", thai: "ปีอะไร / กี่ปี", icon: "❓" },
                    { hiragana: "ーがつ", kanji: "―月", thai: "เดือน...", icon: "🗓️" },
                    { hiragana: "なんがつ", kanji: "何月", thai: "เดือนอะไร", icon: "❓" }
                ]
            },
            {
                id: 'dates',
                navName: '6. วันที่',
                title: '📅 หมวดที่ 6: วันที่ และวันสำคัญ (Dates)',
                items: [
                    { hiragana: "ついたち", kanji: "1日", thai: "วันที่ 1", icon: "1️⃣" },
                    { hiragana: "ふつか", kanji: "2日", thai: "วันที่ 2 / 2 วัน", icon: "2️⃣" },
                    { hiragana: "みっか", kanji: "3日", thai: "วันที่ 3 / 3 วัน", icon: "3️⃣" },
                    { hiragana: "よっか", kanji: "4日", thai: "วันที่ 4 / 4 วัน", icon: "4️⃣" },
                    { hiragana: "いつか", kanji: "5日", thai: "วันที่ 5 / 5 วัน", icon: "5️⃣" },
                    { hiragana: "むいか", kanji: "6日", thai: "วันที่ 6 / 6 วัน", icon: "6️⃣" },
                    { hiragana: "なのか", kanji: "7日", thai: "วันที่ 7 / 7 วัน", icon: "7️⃣" },
                    { hiragana: "ようか", kanji: "8日", thai: "วันที่ 8 / 8 วัน", icon: "8️⃣" },
                    { hiragana: "ここのか", kanji: "9日", thai: "วันที่ 9 / 9 วัน", icon: "9️⃣" },
                    { hiragana: "とおか", kanji: "10日", thai: "วันที่ 10 / 10 วัน", icon: "🔟" },
                    { hiragana: "じゅうよっか", kanji: "14日", thai: "วันที่ 14 / 14 วัน", icon: "1️⃣4️⃣" },
                    { hiragana: "はつか", kanji: "20日", thai: "วันที่ 20 / 20 วัน", icon: "2️⃣0️⃣" },
                    { hiragana: "にじゅうよっか", kanji: "24日", thai: "วันที่ 24 / 24 วัน", icon: "2️⃣4️⃣" },
                    { hiragana: "ーにち", kanji: "―日", thai: "วันที่... / ...วัน", icon: "📆" },
                    { hiragana: "なんにち", kanji: "何日", thai: "วันที่เท่าไร / กี่วัน", icon: "❓" },
                    { hiragana: "いつ", kanji: "-", thai: "เมื่อไร", icon: "⏰" },
                    { hiragana: "たんじょうび", kanji: "誕生日", thai: "วันเกิด", icon: "🎂" }
                ]
            }
        ];

        let activeCategoryIndex = 0;
        let activeItems = [];

        function init() {
            renderNavTabs();
            loadCategory(0);
            initSakuraEffect();
        }

        function renderNavTabs() {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = '';
            vocabularyData.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = `nav-tab ${idx === activeCategoryIndex ? 'active' : ''}`;
                btn.innerText = cat.navName;
                btn.onclick = () => loadCategory(idx);
                nav.appendChild(btn);
            });
        }

        function loadCategory(index) {
            activeCategoryIndex = index;
            const category = vocabularyData[activeCategoryIndex];
            activeItems = [...category.items];

            document.getElementById('catTitle').innerText = category.title;
            document.getElementById('prevBtn').disabled = (activeCategoryIndex === 0);
            document.getElementById('nextBtn').disabled = (activeCategoryIndex === vocabularyData.length - 1);

            renderNavTabs();
            renderCards();
        }

        function navigateCategory(dir) {
            const nextIdx = activeCategoryIndex + dir;
            if (nextIdx >= 0 && nextIdx < vocabularyData.length) {
                loadCategory(nextIdx);
            }
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            activeItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = (e) => {
                    if (e.target.closest('.audio-btn')) return;
                    card.classList.toggle('flipped');
                };

                const kanjiMarkup = (item.kanji && item.kanji !== '-') ? `<div class="jp-kanji">${item.kanji}</div>` : '';

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <button class="audio-btn" title="ฟังเสียงอ่าน" onclick="playAudio('${item.hiragana}')">🔊</button>
                            <div class="jp-hiragana">${item.hiragana}</div>
                            ${kanjiMarkup}
                        </div>
                        <div class="card-back">
                            <div class="visual-icon">${item.icon}</div>
                            <div class="th-meaning">${item.thai}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Shuffle cards with dynamic visual movement animation
        function shuffleCards() {
            const cards = document.querySelectorAll('.card');
            
            // Phase 1: Apply shuffle movement effect to existing cards
            cards.forEach(card => {
                card.classList.remove('flipped'); // Reset flip first
                const randomX = (Math.random() - 0.5) * 60;
                const randomY = (Math.random() - 0.5) * 40;
                const randomRotate = (Math.random() - 0.5) * 25;
                
                card.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRotate}deg) scale(0.8)`;
                card.style.opacity = '0.3';
            });

            // Phase 2: Perform actual data shuffle and re-render with pop-in
            setTimeout(() => {
                for (let i = activeItems.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [activeItems[i], activeItems[j]] = [activeItems[j], activeItems[i]];
                }
                renderCards();
            }, 300);
        }

        function resetFlips() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                const cleanText = text.replace(/ー/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        function initSakuraEffect() {
            const layer = document.getElementById('sakuraLayer');
            const totalPetals = 15;
            for (let i = 0; i < totalPetals; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const size = Math.random() * 10 + 8;
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.left = `${Math.random() * 100}%`;
                petal.style.animationDuration = `${Math.random() * 6 + 7}s`;
                petal.style.animationDelay = `${Math.random() * 5}s`;
                layer.appendChild(petal);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
