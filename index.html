<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minna no Nihongo Lesson 5 - Modern Vector Flashcards & Drag Match</title>
    
    <!-- Modern Japanese & Thai Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Modern Vector Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #ff6b8b;
            --primary-light: #ff8ea7;
            --primary-soft: #fff0f3;
            --secondary-teal: #14b8a6;
            --card-bg: #ffffff;
            --card-back-bg: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            --text-main: #2d3436;
            --text-muted: #636e72;
            --shadow-soft: 0 10px 30px rgba(255, 107, 139, 0.12);
            --shadow-hover: 0 15px 35px rgba(255, 107, 139, 0.22);
            --radius-lg: 24px;
            --radius-md: 16px;
            
            --font-jp: "UD Digi Kyokasho N", "UD デジタル教科書体 N", "Zen Maru Gothic", "Klee One", "Noto Sans JP", sans-serif;
            --font-th: 'Prompt', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-th);
        }

        body {
            background: #fff8f9;
            background-image: 
                radial-gradient(#ffccd5 1.5px, transparent 1.5px), 
                radial-gradient(#ffccd5 1.5px, #fff8f9 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Sakura Layer */
        .sakura-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .petal {
            position: absolute;
            background: #ffb3c6;
            border-radius: 15px 0 15px 0;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.1; }
        }

        .app-container {
            max-width: 1040px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 35px 25px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04), 0 10px 25px rgba(255, 107, 139, 0.08);
            position: relative;
            z-index: 20;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-badge {
            display: inline-block;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border: 1px solid #ffccd5;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        h1 span {
            color: var(--primary);
            font-family: var(--font-jp);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* Segmented Mode Switcher */
        .mode-switcher {
            display: flex;
            justify-content: center;
            background: rgba(255, 204, 213, 0.3);
            padding: 6px;
            border-radius: 50px;
            gap: 6px;
            margin-bottom: 25px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #ffccd5;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .mode-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(255, 107, 139, 0.2);
            font-weight: 700;
        }

        /* Category Nav */
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .nav-tab {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px 18px;
            border-radius: 50px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-tab:hover {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: #ffccd5;
        }

        .nav-tab.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.3);
            transform: translateY(-2deg);
        }

        /* Stepper Toolbar */
        .stepper-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: 1px solid #f1f3f5;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .step-btn {
            background: #f8fafc;
            border: 1.5px solid #edf2f7;
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-soft);
        }

        .step-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cat-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Quick Tools */
        .quick-tools {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tool-chip {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-soft);
        }

        /* Modern 3D Flip Card Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            min-height: 320px;
        }

        @keyframes cardPopIn {
            from { opacity: 0; transform: scale(0.85) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card {
            height: 190px;
            perspective: 1000px;
            cursor: pointer;
            animation: cardPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: all 0.3s ease;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
        }

        .card:hover .card-inner {
            box-shadow: var(--shadow-hover);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .card-front {
            background: var(--card-bg);
            border: 1.5px solid #f1f3f5;
        }

        .jp-hiragana {
            font-family: var(--font-jp);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .jp-kanji {
            font-family: var(--font-jp);
            font-size: 1.05rem;
            color: var(--text-muted);
            background: #f8f9fa;
            padding: 3px 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .audio-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #f8f9fa;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            background: var(--primary);
            color: #ffffff;
            transform: scale(1.15);
        }

        .card-back {
            background: var(--card-back-bg);
            color: #ffffff;
            transform: rotateY(180deg);
            gap: 6px;
        }

        /* Modern Vector Icon Wrappers */
        .vector-icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
            color: #ffffff;
        }

        .vector-icon-badge svg {
            width: 28px;
            height: 28px;
            stroke-width: 2.2px;
        }

        .th-meaning {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.2px;
        }

        /* 🎯 BIG FLASHCARD DRAG & DROP MATCHING GAME SECTION */
        .game-section {
            display: none;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            border: 1.5px solid #ffccd5;
            box-shadow: var(--shadow-soft);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--primary-soft);
            padding: 14px 22px;
            border-radius: 18px;
            margin-bottom: 25px;
            border: 1px solid #ffccd5;
        }

        .game-stats {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .drag-pool, .drop-slots {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding: 6px;
        }

        .drag-card {
            background: #ffffff;
            border: 2px solid #ffb3c6;
            border-radius: 20px;
            padding: 18px;
            min-height: 110px;
            font-family: var(--font-jp) !important;
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--primary);
            cursor: grab;
            user-select: none;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.15);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            text-align: center;
            line-height: 1.25;
        }

        .drag-card * {
            font-family: var(--font-jp) !important;
        }

        .drag-card:hover {
            transform: translateY(-3deg);
            box-shadow: 0 12px 25px rgba(255, 107, 139, 0.25);
            border-color: var(--primary);
        }

        .drag-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%) scale(1.05);
            background: #ffffff;
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 18px;
            font-family: var(--font-jp) !important;
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--primary);
            box-shadow: 0 15px 30px rgba(255, 107, 139, 0.35);
            text-align: center;
            min-width: 200px;
        }

        .drag-clone * {
            font-family: var(--font-jp) !important;
        }

        .drop-zone {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 15px 18px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.25s ease;
            position: relative;
        }

        .drop-zone-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--primary-soft);
            color: var(--primary);
            margin-right: 10px;
        }

        .drop-zone-icon svg {
            width: 22px;
            height: 22px;
            stroke-width: 2.2px;
        }

        .drop-zone-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-zone.hovered {
            background: var(--primary-soft);
            border-color: var(--primary);
            border-style: solid;
            transform: scale(1.02);
        }

        .drop-zone.correct {
            background: #e6fffa;
            border-color: var(--secondary-teal);
            border-style: solid;
        }

        .drop-zone.wrong-flash {
            background: #ffe4e6;
            border-color: #f43f5e;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .game-win-banner {
            display: none;
            background: #e6fffa;
            border: 2px solid var(--secondary-teal);
            color: #0d9488;
            padding: 18px;
            border-radius: 18px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            animation: cardPopIn 0.4s ease;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .app-container { padding: 20px 15px; }
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .card { height: 165px; }
            .jp-hiragana { font-size: 1.35rem; }
            .th-meaning { font-size: 1.05rem; }
            .stepper-bar { flex-direction: column; gap: 10px; }
            .game-board { grid-template-columns: 1fr; gap: 15px; }
            .drag-card, .drop-zone { min-height: 95px; }
            .drag-card { font-size: 1.3rem; }
            .drop-zone-label { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div class="sakura-layer" id="sakuraLayer"></div>

    <div class="app-container">
        <header>
            <div class="brand-badge">MINNA NO NIHONGO</div>
            <h1><span>みんなの日本語</span> บทที่ 5</h1>
            <p class="subtitle">บัตรคำศัพท์ภาษาญี่ปุ่นพร้อมเสียงอ่านและเกมจับคู่</p>
        </header>

        <!-- Segmented Mode Switcher -->
        <div class="mode-switcher">
            <button class="mode-btn active" id="btnModeFlashcards" onclick="switchMode('flashcards')">🍱 บัตรคำศัพท์</button>
            <button class="mode-btn" id="btnModeGame" onclick="switchMode('game')">🎯 เกมลากจับคู่คำศัพท์</button>
        </div>

        <!-- FLASHCARDS SECTION -->
        <div id="flashcardSection">
            <div class="category-nav" id="categoryNav"></div>

            <div class="stepper-bar">
                <button class="step-btn" id="prevBtn" onclick="navigateCategory(-1)">
                    <span>←</span> หน้าก่อนหน้า
                </button>
                <div class="cat-title" id="catTitle">หมวดคำศัพท์</div>
                <button class="step-btn" id="nextBtn" onclick="navigateCategory(1)">
                    หน้าถัดไป <span>→</span>
                </button>
            </div>

            <div class="quick-tools">
                <button class="tool-chip" onclick="shuffleCards()">🔀 สลับการ์ดสุ่มคำ</button>
                <button class="tool-chip" onclick="resetFlips()">🔄 หงายการ์ดทั้งหมด</button>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>
        </div>

        <!-- 🎯 BIG FLASHCARD DRAG & DROP MATCHING GAME SECTION -->
        <div class="game-section" id="gameSection">
            <div class="game-header">
                <div class="game-stats">
                    <span>🎯 คะแนน: <span id="gameScore">0</span> / <span id="gameTotal">0</span></span>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <select id="gameCatSelect" onchange="startNewGame()" style="padding:6px 12px; border-radius:10px; border:1px solid #ffccd5; font-weight:bold; color:var(--text-main);">
                        <option value="dates">6. วันที่ (ครบทั้ง 17 วัน)</option>
                        <option value="all">🌟 คำศัพท์ทั้งหมดในบทที่ 5</option>
                        <option value="verbs">1. คำกริยา</option>
                        <option value="places">2. สถานที่</option>
                        <option value="transport">3. ยานพาหนะ</option>
                        <option value="people">4. บุคคล</option>
                        <option value="time">5. เวลา/ช่วงเวลา</option>
                    </select>
                    <button class="tool-chip" onclick="startNewGame()" style="background:var(--primary); color:white; border:none;">🔄 สลับตำแหน่ง</button>
                </div>
            </div>

            <div class="game-win-banner" id="gameWinBanner">
                🎉 ยินดีด้วย! คุณจับคู่การ์ดคำศัพท์ถูกต้องทั้งหมด! 🌸✨
            </div>

            <div class="game-board">
                <!-- Left: Japanese Big Flashcards Drag Pool -->
                <div class="drag-pool" id="dragPool"></div>

                <!-- Right: Thai Meaning Big Target Drop Zones -->
                <div class="drop-slots" id="dropSlots"></div>
            </div>
        </div>

        <footer>
            💡 แตะที่การ์ดเพื่อดูคำแปลและรูปภาพประกอบ | กดรูป 🔊 บนการ์ดเพื่อฟังเสียงอ่าน
        </footer>
    </div>

    <script>
        // Vocabulary dataset with modern Lucide icon names
        const vocabularyData = [
            {
                id: 'verbs',
                navName: '1. กริยา',
                title: '🌸 หมวดที่ 1: คำกริยา (Verbs)',
                items: [
                    { hiragana: "いきます", kanji: "行きます", thai: "ไป", icon: "footprints" },
                    { hiragana: "きます", kanji: "来ます", thai: "มา", icon: "corner-down-left" },
                    { hiragana: "かえります", kanji: "帰ります", thai: "กลับ", icon: "home" }
                ]
            },
            {
                id: 'places',
                navName: '2. สถานที่',
                title: '🏫 หมวดที่ 2: สถานที่ (Places)',
                items: [
                    { hiragana: "がっこう", kanji: "学校", thai: "โรงเรียน", icon: "graduation-cap" },
                    { hiragana: "スーパー", kanji: "-", thai: "ซูเปอร์มาร์เก็ต", icon: "shopping-cart" },
                    { hiragana: "えき", kanji: "駅", thai: "สถานีรถไฟ", icon: "map-pin" }
                ]
            },
            {
                id: 'transport',
                navName: '3. ยานพาหนะ',
                title: '🚆 หมวดที่ 3: ยานพาหนะ (Vehicles)',
                items: [
                    { hiragana: "ひこうき", kanji: "飛行機", thai: "เครื่องบิน", icon: "plane" },
                    { hiragana: "ふね", kanji: "船", thai: "เรือ", icon: "ship" },
                    { hiragana: "でんしゃ", kanji: "電車", thai: "รถไฟฟ้า", icon: "train" },
                    { hiragana: "ちかてつ", kanji: "地下鉄", thai: "รถไฟใต้ดิน", icon: "subway" },
                    { hiragana: "しんかんせん", kanji: "新幹線", thai: "รถไฟชินคันเซ็น", icon: "zap" },
                    { hiragana: "バス", kanji: "-", thai: "รถบัส", icon: "bus" },
                    { hiragana: "タクシー", kanji: "-", thai: "รถแท็กซี่", icon: "car" },
                    { hiragana: "じてんしゃ", kanji: "自転車", thai: "จักรยาน", icon: "bike" },
                    { hiragana: "あるいて", kanji: "歩いて", thai: "เดิน", icon: "footprints" }
                ]
            },
            {
                id: 'people',
                navName: '4. บุคคล',
                title: '👥 หมวดที่ 4: บุคคล (People)',

            {

                items: [

                    { hiragana: "こんしゅう", kanji: "今週", thai: "สัปดาห์นี้", icon: "calendar-days" },
                    { hiragana: "らいしゅう", kanji: "来週", thai: "สัปดาห์หน้า", icon: "calendar-plus" },
                    { hiragana: "せんげつ", kanji: "先月", thai: "เดือนที่แล้ว", icon: "calendar-minus" },
                    { hiragana: "こんげつ", kanji: "今月", thai: "เดือนนี้", icon: "calendar-check" },

                    { hiragana: "ことし", kanji: "今年", thai: "ปีนี้", icon: "sparkles" },
                    { hiragana: "らいねん", kanji: "来年", thai: "ปีหน้า", icon: "rocket" },
                    { hiragana: "ーねん", kanji: "―年", thai: "ปี...", icon: "hash" },
                    { hiragana: "なんねん", kanji: "何年", thai: "ปีอะไร / กี่ปี", icon: "help-circle" },
                    { hiragana: "ーがつ", kanji: "―月", thai: "เดือน...", icon: "calendar" },
                    { hiragana: "なんがつ", kanji: "何月", thai: "เดือนอะไร", icon: "help-circle" }
                ]
            },
            {
                id: 'dates',
                navName: '6. วันที่',
                title: '📅 หมวดที่ 6: วันที่ และวันสำคัญ (Dates)',
                items: [
                    { hiragana: "ついたち", kanji: "-", thai: "วันที่ 1", icon: "calendar-days" },
                    { hiragana: "ふつか", kanji: "-", thai: "วันที่ 2 / 2 วัน", icon: "calendar-days" },
                    { hiragana: "みっか", kanji: "-", thai: "วันที่ 3 / 3 วัน", icon: "calendar-days" },
                    { hiragana: "よっか", kanji: "-", thai: "วันที่ 4 / 4 วัน", icon: "calendar-days" },
                    { hiragana: "いつか", kanji: "-", thai: "วันที่ 5 / 5 วัน", icon: "calendar-days" },
                    { hiragana: "むいか", kanji: "-", thai: "วันที่ 6 / 6 วัน", icon: "calendar-days" },
                    { hiragana: "なのか", kanji: "-", thai: "วันที่ 7 / 7 วัน", icon: "calendar-days" },
                    { hiragana: "ようか", kanji: "-", thai: "วันที่ 8 / 8 วัน", icon: "calendar-days" },
                    { hiragana: "ここのか", kanji: "-", thai: "วันที่ 9 / 9 วัน", icon: "calendar-days" },
                    { hiragana: "とおか", kanji: "-", thai: "วันที่ 10 / 10 วัน", icon: "calendar-days" },
                    { hiragana: "じゅうよっか", kanji: "-", thai: "วันที่ 14 / 14 วัน", icon: "calendar-days" },
                    { hiragana: "はつか", kanji: "-", thai: "วันที่ 20 / 20 วัน", icon: "calendar-days" },
                    { hiragana: "にじゅうよっか", kanji: "-", thai: "วันที่ 24 / 24 วัน", icon: "calendar-days" },
                    { hiragana: "ーにち", kanji: "―日", thai: "วันที่... / ...วัน", icon: "calendar" },
                    { hiragana: "なんにち", kanji: "何日", thai: "วันที่เท่าไร / กี่วัน", icon: "help-circle" },
                    { hiragana: "いつ", kanji: "-", thai: "เมื่อไร", icon: "clock" },
                    { hiragana: "たんじょうび", kanji: "誕生日", thai: "วันเกิด", icon: "gift" }
                ]
            }
        ];

        let activeCategoryIndex = 0;
        let activeItems = [];

        function init() {
            renderNavTabs();
            loadCategory(0);
            initSakuraEffect();
        }

        function getBestNaturalJapaneseVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices();
            const jaVoices = voices.filter(v => v.lang.includes('ja') || v.lang.includes('JA'));
            if (jaVoices.length === 0) return null;

            const naturalKeywords = ['Natural', 'Enhanced', 'Premium', 'Google', 'Kyoko', 'Otoya', 'Nanami', 'Keita', 'Online'];
            for (let kw of naturalKeywords) {
                const found = jaVoices.find(v => v.name.includes(kw));
                if (found) return found;
            }
            return jaVoices[0];
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                const cleanText = text.replace(/ー/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;

                const bestVoice = getBestNaturalJapaneseVoice();
                if (bestVoice) utterance.voice = bestVoice;

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        function renderNavTabs() {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = '';
            vocabularyData.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = `nav-tab ${idx === activeCategoryIndex ? 'active' : ''}`;
                btn.innerText = cat.navName;
                btn.onclick = () => loadCategory(idx);
                nav.appendChild(btn);
            });
        }

        function loadCategory(index) {
            activeCategoryIndex = index;
            const category = vocabularyData[activeCategoryIndex];
            activeItems = [...category.items];

            document.getElementById('catTitle').innerText = category.title;
            document.getElementById('prevBtn').disabled = (activeCategoryIndex === 0);
            document.getElementById('nextBtn').disabled = (activeCategoryIndex === vocabularyData.length - 1);

            renderNavTabs();
            renderCards();
        }

        function navigateCategory(dir) {
            const nextIdx = activeCategoryIndex + dir;
            if (nextIdx >= 0 && nextIdx < vocabularyData.length) {
                loadCategory(nextIdx);
            }
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            activeItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = (e) => {
                    if (e.target.closest('.audio-btn')) return;
                    card.classList.toggle('flipped');
                };

                const kanjiMarkup = (item.kanji && item.kanji !== '-') ? `<div class="jp-kanji">${item.kanji}</div>` : '';

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <button class="audio-btn" title="ฟังเสียงอ่าน" onclick="playAudio('${item.hiragana}')">🔊</button>
                            <div class="jp-hiragana">${item.hiragana}</div>
                            ${kanjiMarkup}
                        </div>
                        <div class="card-back">
                            <div class="vector-icon-badge"><i data-lucide="${item.icon}"></i></div>
                            <div class="th-meaning">${item.thai}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (window.lucide) lucide.createIcons();
        }

        function shuffleCards() {
            for (let i = activeItems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activeItems[i], activeItems[j]] = [activeItems[j], activeItems[i]];
            }
            renderCards();
        }

        function resetFlips() {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
        }

        function switchMode(mode) {
            document.getElementById('btnModeFlashcards').classList.toggle('active', mode === 'flashcards');
            document.getElementById('btnModeGame').classList.toggle('active', mode === 'game');

            document.getElementById('flashcardSection').style.display = (mode === 'flashcards') ? 'block' : 'none';
            document.getElementById('gameSection').style.display = (mode === 'game') ? 'block' : 'none';

            if (mode === 'game') startNewGame();
        }

        function initSakuraEffect() {
            const layer = document.getElementById('sakuraLayer');
            const totalPetals = 15;
            for (let i = 0; i < totalPetals; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const size = Math.random() * 10 + 8;
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.left = `${Math.random() * 100}%`;
                petal.style.animationDuration = `${Math.random() * 6 + 7}s`;
                petal.style.animationDelay = `${Math.random() * 5}s`;
                layer.appendChild(petal);
            }
        }

        /* 🎯 NO-LIMIT BIG FLASHCARD DRAG & DROP GAME LOGIC */
        let gameScore = 0;
        let gameTotalWords = 0;
        let activeDragCard = null;
        let dragCloneEl = null;

        function startNewGame() {
            gameScore = 0;
            document.getElementById('gameWinBanner').style.display = 'none';

            const selectedCatId = document.getElementById('gameCatSelect').value;
            let words = [];

            if (selectedCatId === 'all') {
                vocabularyData.forEach(cat => words.push(...cat.items));
            } else {
                const categoryObj = vocabularyData.find(cat => cat.id === selectedCatId);
                if (categoryObj) words = [...categoryObj.items];
            }

            words.sort(() => 0.5 - Math.random());

            gameTotalWords = words.length;
            document.getElementById('gameScore').innerText = '0';
            document.getElementById('gameTotal').innerText = gameTotalWords;

            // Render Japanese Big Drag Cards
            const poolEl = document.getElementById('dragPool');
            poolEl.innerHTML = '';
            const shuffledJp = [...words].sort(() => 0.5 - Math.random());

            shuffledJp.forEach((word) => {
                const card = document.createElement('div');
                card.className = 'drag-card';
                card.dataset.id = word.hiragana;
                card.dataset.hiragana = word.hiragana;

                const kanjiTxt = (word.kanji && word.kanji !== '-') ? `<div style="font-size:1rem; opacity:0.8; font-weight:normal; margin-top:2px;">(${word.kanji})</div>` : '';
                card.innerHTML = `<div>${word.hiragana}</div>${kanjiTxt}`;

                card.onpointerdown = (e) => onDragStart(e, card);
                poolEl.appendChild(card);
            });

            // Render Thai Big Drop Slots with Vector Icons
            const slotsEl = document.getElementById('dropSlots');
            slotsEl.innerHTML = '';
            const shuffledThai = [...words].sort(() => 0.5 - Math.random());

            shuffledThai.forEach((word) => {
                const slot = document.createElement('div');
                slot.className = 'drop-zone';
                slot.dataset.id = word.hiragana;
                slot.innerHTML = `
                    <div class="drop-zone-label">
                        <span class="drop-zone-icon"><i data-lucide="${word.icon}"></i></span>
                        <span>${word.thai}</span>
                    </div>
                `;
                slotsEl.appendChild(slot);
            });

            if (window.lucide) lucide.createIcons();
        }

        /* Universal Pointer/Touch Drag Handling */
        function onDragStart(e, card) {
            if (card.parentElement.classList.contains('drop-zone')) return;

            e.preventDefault();
            activeDragCard = card;
            card.classList.add('dragging');

            playAudio(card.dataset.hiragana);

            dragCloneEl = card.cloneNode(true);
            dragCloneEl.className = 'drag-clone';
            document.body.appendChild(dragCloneEl);

            moveClone(e.clientX, e.clientY);

            window.onpointermove = onDragMove;
            window.onpointerup = onDragEnd;
        }

        function moveClone(x, y) {
            if (dragCloneEl) {
                dragCloneEl.style.left = `${x}px`;
                dragCloneEl.style.top = `${y}px`;
            }
        }

        function onDragMove(e) {
            if (!activeDragCard) return;
            moveClone(e.clientX, e.clientY);

            document.querySelectorAll('.drop-zone:not(.correct)').forEach(zone => {
                const rect = zone.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    zone.classList.add('hovered');
                } else {
                    zone.classList.remove('hovered');
                }
            });
        }

        function onDragEnd(e) {
            if (!activeDragCard) return;

            window.onpointermove = null;
            window.onpointerup = null;

            if (dragCloneEl) {
                dragCloneEl.remove();
                dragCloneEl = null;
            }

            let droppedZone = null;
            document.querySelectorAll('.drop-zone:not(.correct)').forEach(zone => {
                zone.classList.remove('hovered');
                const rect = zone.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    droppedZone = zone;
                }
            });

            if (droppedZone) {
                if (droppedZone.dataset.id === activeDragCard.dataset.id) {
                    // Correct Match!
                    droppedZone.classList.add('correct');
                    droppedZone.appendChild(activeDragCard);
                    activeDragCard.style.border = 'none';
                    activeDragCard.style.boxShadow = 'none';
                    activeDragCard.style.padding = '0';
                    activeDragCard.style.background = 'transparent';
                    activeDragCard.style.minHeight = 'auto';

                    gameScore++;
                    document.getElementById('gameScore').innerText = gameScore;

                    if (gameScore === gameTotalWords) {
                        document.getElementById('gameWinBanner').style.display = 'block';
                    }
                } else {
                    // Wrong Match Shake Effect
                    droppedZone.classList.add('wrong-flash');
                    setTimeout(() => droppedZone.classList.remove('wrong-flash'), 400);
                }
            }

            activeDragCard.classList.remove('dragging');
            activeDragCard = null;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { getBestNaturalJapaneseVoice(); };
        }

        window.onload = init;
    </script>
